target-version = "py310"

line-length = 100

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes (detects unused imports/variables)
    "I",    # isort (will alphabetize your import block)
    "B",    # flake8-bugbear (finds common bugs/design problems)
    "C4",   # flake8-comprehensions (helps write better list/dict comprehensions)
    "SIM",  # flake8-simplify (suggests standard simplifications, e.g., for if-statements)
    "UP",   # pyupgrade (will modernize syntax where safe for py38)
    "D",    # pydocstyle (enforces docstring rules)
]

ignore = [
    # Ignore missing docstrings for basic/magic methods, as you only document complex ones
    "D105", # Missing docstring in magic method
    "D107", # Missing docstring in __init__
    "D203", # 1 blank line required before class docstring (conflicts with D211)
    "D212", # Multi-line docstring summary should start at the first line (conflicts with D213)
]

[lint.pydocstyle]
convention = "pep257"

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
